# /etc/nginx/sites-available/livetchat
# nginx fait le HTTPS sur le port 8000 (certificat auto-signé, épinglé dans le client),
# limite les abus, et envoie lui-même les médias (X-Accel-Redirect).

limit_req_zone  $binary_remote_addr zone=lt_login:1m rate=5r/m;
limit_req_zone  $binary_remote_addr zone=lt_api:1m   rate=10r/s;
limit_conn_zone $binary_remote_addr zone=lt_conn:1m;
limit_req_status  429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream livetchat_app {
    server 127.0.0.1:8001;
    keepalive 8;
}

server {
    listen 8000 ssl http2 default_server;
    listen [::]:8000 ssl http2 default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/livetchat/tls/cert.pem;
    ssl_certificate_key /etc/livetchat/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:LTSSL:1m;
    ssl_session_timeout 1d;

    # Requête HTTP en clair sur le port HTTPS -> renvoyée en HTTPS
    error_page 497 =301 https://$host:$server_port$request_uri;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 26m;
    client_body_timeout  60s;
    send_timeout         60s;
    limit_conn lt_conn 30;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location = /api/login {
        limit_req zone=lt_login burst=5 nodelay;
        proxy_pass http://livetchat_app;
    }

    location = /api/upload {
        limit_req zone=lt_api burst=5;
        # nginx garde l'upload sur disque puis le passe d'un coup : Python n'attend pas les clients lents
        proxy_request_buffering on;
        proxy_read_timeout 60s;
        proxy_pass http://livetchat_app;
    }

    location /api/ {
        limit_req zone=lt_api burst=20 nodelay;
        proxy_pass http://livetchat_app;
    }

    location /media/ {
        limit_req zone=lt_api burst=30 nodelay;
        proxy_pass http://livetchat_app;
    }

    location = /manifest.json {
        limit_req zone=lt_api burst=10 nodelay;
        proxy_pass http://livetchat_app;
    }

    location = /ws {
        proxy_pass http://livetchat_app;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Exe du client (mise à jour auto)
    location /downloads/ {
        alias /var/lib/livetchat/downloads/;
        autoindex off;
        limit_rate_after 1m;
        limit_rate 4m;
    }

    # Accessible seulement via X-Accel-Redirect envoyé par l'appli, après vérification du lien signé
    location /_protected_media/ {
        internal;
        alias /var/lib/livetchat/media/;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / { return 404; }
}
